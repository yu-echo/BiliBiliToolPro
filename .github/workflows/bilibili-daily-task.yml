name: B站粉丝牌每日任务

# 上游把 GitHub Actions 模板归档到 platforms/gitHubActions/bak/ 了（.NET 6 + 已废弃语法，
# 跑不起来），这份是针对 .NET 10 重写的可用版本。

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: '要跑的任务（LiveFansMedal / Daily&LiveFansMedal）'
        type: string
        default: 'LiveFansMedal'
      max_watch:
        description: '最多挂几个直播间（0 = 不限）'
        type: string
        default: '4'
      heartbeats:
        description: '每个直播间挂几分钟（B站规则：满 15 分钟 +1 点，上限 10 次/天）'
        type: string
        default: '16'
  schedule:
    # UTC 16:05 = 北京时间 00:05，亲密度 0 点重置后立刻跑
    - cron: '5 16 * * *'

# 同一时间只跑一个，避免两次任务抢同一批房间
concurrency:
  group: bili-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 编译
        run: dotnet build src/Ray.BiliBiliTool.Console/Ray.BiliBiliTool.Console.csproj -c Release

      - name: 执行任务
        env:
          ASPNETCORE_ENVIRONMENT: Production
          # cookie 形如：SESSDATA=xxx; bili_jct=yyy; DedeUserID=zzz
          Ray_BiliBiliCookies__1: ${{ secrets.COOKIESTR_1 }}
          Ray_BiliBiliCookies__2: ${{ secrets.COOKIESTR_2 }}
          # 直播间互动
          Ray_LiveFansMedalTaskConfig__EnableWatch: 'true'
          Ray_LiveFansMedalTaskConfig__EnableLike: 'true'
          # 发弹幕会在别人直播间留下弹幕，默认关；想要那 10 点亲密度再打开
          Ray_LiveFansMedalTaskConfig__EnableDanmaku: 'false'
          Ray_LiveFansMedalTaskConfig__MaxWatchAnchors: ${{ inputs.max_watch || '4' }}
          Ray_LiveFansMedalTaskConfig__HeartBeatNumber: ${{ inputs.heartbeats || '16' }}
          # PushPlus 推送（没配这个 secret 就等于不推送）
          Ray_Serilog__WriteTo__9__Args__token: ${{ secrets.PUSHPLUS_TOKEN }}
        run: >
          dotnet run --project src/Ray.BiliBiliTool.Console -c Release --no-build --
          --runTasks=${{ inputs.tasks || 'LiveFansMedal' }}
